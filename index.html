<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <title>AI Knee Screening - Pro Version</title>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/pose/pose.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/drawing_utils/drawing_utils.js"></script>
    <style>
        body { text-align: center; font-family: sans-serif; background: #121212; color: white; }
        .container { position: relative; width: 640px; margin: auto; }
        video, canvas { position: absolute; left: 0; top: 0; width: 100%; border-radius: 15px; }
        #ui { margin-top: 500px; padding: 20px; }
        .big-text { font-size: 3rem; color: #00ffcc; }
        #status { color: yellow; font-weight: bold; }
    </style>
</head>
<body>

    <h1>AI ลุกนั่ง (Sit-to-Stand)</h1>
    <div class="container">
        <video id="video" playsinline></video>
        <canvas id="output" width="640" height="480"></canvas>
    </div>

    <div id="ui">
        <div id="status">กำลังโหลด AI...</div>
        <div>จำนวนครั้ง: <span id="counter" class="big-text">0</span></div>
    </div>

    <script>
        const video = document.getElementById('video');
        const canvas = document.getElementById('output');
        const ctx = canvas.getContext('2d');
        const counterEl = document.getElementById('counter');
        const statusEl = document.getElementById('status');

        let count = 0;
        let isStanding = true;

        const pose = new Pose({locateFile: file => `https://cdn.jsdelivr.net/npm/@mediapipe/pose/${file}`});
        
        pose.setOptions({
            modelComplexity: 1,
            smoothLandmarks: true,
            minDetectionConfidence: 0.5,
            minTrackingConfidence: 0.5
        });

        pose.onResults(results => {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            
            if (!results.poseLandmarks) {
                statusEl.innerText = "❌ กรุณายืนด้านข้าง ให้เห็นสะโพกและเข่า";
                return;
            }

            // วาดโครงกระดูกให้เห็นว่า AI จับถูกไหม
            drawConnectors(ctx, results.poseLandmarks, POSE_CONNECTIONS, {color: '#00FF00', lineWidth: 3});
            
            // Logic การนับ
            const hip = results.poseLandmarks[24];
            const knee = results.poseLandmarks[26];
            
            statusEl.innerText = "✅ AI พร้อมนับ! เริ่มลุกนั่งได้เลย";

            if (isStanding && (hip.y > knee.y - 0.05)) {
                isStanding = false;
            } else if (!isStanding && (hip.y < knee.y - 0.15)) {
                isStanding = true;
                count++;
                counterEl.innerText = count;
            }
        });

        // ดึงกล้อง
        navigator.mediaDevices.getUserMedia({video: true}).then(stream => {
            video.srcObject = stream;
            video.play();
            
            // ส่งภาพเข้า AI ทุกๆ เฟรม
            function process() {
                if (video.readyState === video.HAVE_ENOUGH_DATA) {
                    pose.send({image: video});
                }
                requestAnimationFrame(process);
            }
            process();
        });
    </script>
</body>
</html>
