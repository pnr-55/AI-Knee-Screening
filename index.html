<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>KneeAI - หน้าแรก</title>
  <!-- Tailwind CSS & Google Fonts -->
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Prompt', sans-serif; background-color: #f4f8ff; }
    /* พื้นหลังไล่สีฟ้านุ่มๆ สไตล์ทางการแพทย์ */
    .hero-bg {
      background: linear-gradient(135deg, #eef5ff 0%, #dbeafe 50%, #eff6ff 100%);
    }
  </style>
</head>
<body class="min-h-screen flex items-center justify-center p-3 sm:p-6">

  <!-- Frame กรอบจำลองหน้าจอแอป -->
  <div class="w-full max-w-sm bg-white rounded-[32px] shadow-2xl border border-blue-100 overflow-hidden hero-bg p-6 flex flex-col justify-between min-h-[680px] relative">
    
    <!-- 1. Header -->
    <div class="flex justify-between items-center w-full pt-1">
      <!-- Logo + Name -->
      <div class="flex items-center gap-2">
        <div class="w-8 h-8 bg-blue-600 rounded-xl flex items-center justify-center text-white shadow-md shadow-blue-500/20">
          <svg class="w-5 h-5 fill-current" viewBox="0 0 24 24">
            <path d="M19 10.5h-5.5V5c0-.83-.67-1.5-1.5-1.5s-1.5.67-1.5 1.5v5.5H5c-.83 0-1.5.67-1.5 1.5s.67 1.5 1.5 1.5h5.5V19c0 .83.67 1.5 1.5 1.5s1.5-.67 1.5-1.5v-5.5H19c.83 0 1.5-.67 1.5-1.5s-.67-1.5-1.5-1.5z"/>
          </svg>
        </div>
        <span class="font-bold text-xl text-blue-950 tracking-tight">KneeAI</span>
      </div>
      
      <!-- Hamburger Menu Icon -->
      <button class="text-slate-700 p-1">
        <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"/>
        </svg>
      </button>
    </div>

    <!-- 2. Hero Content Area -->
    <div class="my-auto py-4">
      <h1 class="text-xl font-bold text-slate-900 leading-snug mb-3">
        AI คัดกรองและประเมิน<br>ความเสี่ยงโรคข้อเข่าเสื่อม<br>และภาวะขาโก่ง
      </h1>
      
      <p class="text-xs text-slate-500 leading-relaxed mb-6">
        เทคโนโลยี AI ช่วยวิเคราะห์โครงสร้างขา<br>เพื่อการดูแลสุขภาพเข่าที่แม่นยำ
      </p>

      <!-- Action Buttons -->
      <div class="space-y-2.5">
        <!-- ปุ่มเริ่มตรวจประเมิน -->
        <button onclick="alert('กำลังเชื่อมต่อไปหน้าถัดไป...')" class="w-full py-3.5 bg-blue-600 hover:bg-blue-700 text-white font-medium text-sm rounded-xl shadow-lg shadow-blue-500/25 transition-all">
          เริ่มตรวจประเมิน
        </button>
        
        <!-- ปุ่มเข้าสู่ระบบ -->
        <button class="w-full py-3 bg-white hover:bg-slate-50 text-slate-700 font-medium text-sm rounded-xl border border-slate-200 shadow-sm transition-all">
          เข้าสู่ระบบ
        </button>
      </div>
    </div>

    <!-- 3. Feature Cards (การ์ด 3 ช่องด้านล่าง) -->
    <div>
      <div class="grid grid-cols-3 gap-2 mb-4">
        
        <!-- Card 1: แม่นยำ -->
        <div class="bg-white/90 backdrop-blur-sm p-3 rounded-2xl border border-white shadow-sm text-center">
          <div class="w-7 h-7 mx-auto mb-2 text-blue-600 flex items-center justify-center">
            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 19l9 2-9-18-9 18 9-2zm0 0v-8"/>
            </svg>
          </div>
          <div class="font-bold text-xs text-slate-800">แม่นยำ</div>
          <div class="text-[10px] text-slate-400 mt-0.5">ด้วย AI</div>
        </div>

        <!-- Card 2: รวดเร็ว -->
        <div class="bg-white/90 backdrop-blur-sm p-3 rounded-2xl border border-white shadow-sm text-center">
          <div class="w-7 h-7 mx-auto mb-2 text-blue-600 flex items-center justify-center">
            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z"/>
            </svg>
          </div>
          <div class="font-bold text-xs text-slate-800">รวดเร็ว</div>
          <div class="text-[10px] text-slate-400 mt-0.5">ภายใน 1 นาที</div>
        </div>

        <!-- Card 3: ปลอดภัย -->
        <div class="bg-white/90 backdrop-blur-sm p-3 rounded-2xl border border-white shadow-sm text-center">
          <div class="w-7 h-7 mx-auto mb-2 text-blue-600 flex items-center justify-center">
            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"/>
            </svg>
          </div>
          <div class="font-bold text-xs text-slate-800">ปลอดภัย</div>
          <div class="text-[10px] text-slate-400 mt-0.5">ข้อมูลเป็นความลับ</div>
        </div>

      </div>

      <!-- 4. Footer Link -->
      <div class="text-center pt-1 pb-2">
        <a href="#" class="text-xs text-blue-600 font-medium hover:underline flex items-center justify-center gap-1">
          <span>คู่มือการใช้งาน</span>
          <span>&gt;</span>
        </a>
      </div>
    </div>

  </div>

</body>
</html>
