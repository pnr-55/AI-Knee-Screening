<!DOCTYPE html>
<html lang="th">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI คัดกรองขาโก่ง</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #eaf4ff;
            text-align: center;
            padding: 40px;
        }

        h1 {
            color: #145da0;
        }

        .container {
            background: white;
            width: 360px;
            margin: auto;
            padding: 30px;
            border-radius: 20px;
            box-shadow: 0 5px 15px #bbb;
        }

        button {
            background-color: #145da0;
            color: white;
            border: none;
            padding: 12px 25px;
            border-radius: 10px;
            cursor: pointer;
            font-size: 16px;
        }

        button:hover {
            background-color: #0b3d91;
        }

        #preview {
            margin-top: 20px;
            max-width: 300px;
            border-radius: 10px;
        }

        #result {
            margin-top: 20px;
            color: #145da0;
        }
    </style>

</head>


<body>

    <h1>AI คัดกรองขาโก่ง</h1>

    <div class="container">

        <h2>อัปโหลดภาพขา</h2>

        <input type="file" id="imageInput" accept="image/*">

        <br><br>

        <img id="preview">

        <br><br>

        <button id="analyzeButton">
            วิเคราะห์ภาพ
        </button>

        <div id="result"></div>

    </div>


<script>

    // แสดงภาพที่เลือก

    const imageInput = document.getElementById("imageInput");
    const preview = document.getElementById("preview");


    imageInput.addEventListener("change", function(){

        const file = imageInput.files[0];

        if(file){
            preview.src = URL.createObjectURL(file);
        }

    });



    // ปุ่มวิเคราะห์

    const analyzeButton = document.getElementById("analyzeButton");


    analyzeButton.addEventListener("click", function(){


        document.getElementById("result").innerHTML =
        `
        <h3>ผลการวิเคราะห์</h3>
        <p>ลักษณะขา: ปกติ</p>
        <p>ความมั่นใจของ AI: 90%</p>
        <p>หมายเหตุ: ผลลัพธ์นี้เป็นการทดสอบระบบ</p>
        `;


    });


</script>


</body>

</html>
