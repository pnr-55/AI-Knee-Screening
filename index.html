<!-- ดึง Libs ของ MediaPipe Pose และ Camera Utils -->
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/pose/pose.js" crossorigin="anonymous"></script>

<script>
  const videoElement = document.getElementById('video');
  const canvasElement = document.getElementById('canvas');
  const canvasCtx = canvasElement.getContext('2d');

  // ฟังก์ชันคำนวณมุมระหว่างจุด 3 จุด (A, B, C) โดยมี B เป็นจุดยอด (เช่น สะโพก-เข่า-ข้อเท้า)
  function calculateAngle(a, b, c) {
    const radians = Math.atan2(c.y - b.y, c.x - b.x) - Math.atan2(a.y - b.y, a.x - b.x);
    let angle = Math.abs((radians * 180.0) / Math.PI);
    if (angle > 180.0) {
      angle = 360 - angle;
    }
    return Math.round(angle);
  }

  // ฟังก์ชันประมวลผลผลลัพธ์จาก MediaPipe Pose
  function onResults(results) {
    // ปรับขนาด Canvas ให้ตรงกับ Video
    canvasElement.width = videoElement.videoWidth;
    canvasElement.height = videoElement.videoHeight;

    canvasCtx.save();
    canvasCtx.clearRect(0, 0, canvasElement.width, canvasElement.height);

    if (results.poseLandmarks) {
      const landmarks = results.poseLandmarks;

      // ตำแหน่งจุดทางกายวิภาค (MediaPipe Pose Keypoints)
      // 23: Left Hip, 25: Left Knee, 27: Left Ankle
      // 24: Right Hip, 26: Right Knee, 28: Right Ankle
      const leftHip = landmarks[23];
      const leftKnee = landmarks[25];
      const leftAnkle = landmarks[27];

      const rightHip = landmarks[24];
      const rightKnee = landmarks[26];
      const rightAnkle = landmarks[28];

      // 1. คำนวณมุม Knee Angle ซ้าย และ ขวา
      if (leftHip && leftKnee && leftAnkle) {
        const leftKneeAngle = calculateAngle(leftHip, leftKnee, leftAnkle);
        document.getElementById('angle-l').innerText = leftKneeAngle + '°';
      }

      if (rightHip && rightKnee && rightAnkle) {
        const rightKneeAngle = calculateAngle(rightHip, rightKnee, rightAnkle);
        document.getElementById('angle-r').innerText = rightKneeAngle + '°';
      }

      // 2. วาดจุดและเส้นโครงสร้างบน Canvas (Skeleton Overlay)
      drawSkeleton(landmarks);
    }
    canvasCtx.restore();
  }

  // ฟังก์ชันวาดเส้นจับจุดข้อต่อบน Canvas
  function drawSkeleton(landmarks) {
    const pointsToDraw = [23, 24, 25, 26, 27, 28]; // เน้นเฉพาะช่วงขา
    
    // วาดจุดวงกลมที่ข้อต่อ
    pointsToDraw.forEach(index => {
      const lm = landmarks[index];
      if (lm && lm.visibility > 0.5) {
        canvasCtx.beginPath();
        canvasCtx.arc(lm.x * canvasElement.width, lm.y * canvasElement.height, 6, 0, 2 * Math.PI);
        canvasCtx.fillStyle = '#2563eb'; // สีน้ำเงิน Medical Blue
        canvasCtx.fill();
        canvasCtx.lineWidth = 2;
        canvasCtx.strokeStyle = '#ffffff';
        canvasCtx.stroke();
      }
    });

    // วาดเส้นเชื่อมขาซ้าย (สะโพก -> เข่า -> ข้อเท้า)
    connectPoints(landmarks[23], landmarks[25]);
    connectPoints(landmarks[25], landmarks[27]);

    // วาดเส้นเชื่อมขาขวา (สะโพก -> เข่า -> ข้อเท้า)
    connectPoints(landmarks[24], landmarks[26]);
    connectPoints(landmarks[26], landmarks[28]);
  }

  function connectPoints(p1, p2) {
    if (p1 && p2 && p1.visibility > 0.5 && p2.visibility > 0.5) {
      canvasCtx.beginPath();
      canvasCtx.moveTo(p1.x * canvasElement.width, p1.y * canvasElement.height);
      canvasCtx.lineTo(p2.x * canvasElement.width, p2.y * canvasElement.height);
      canvasCtx.lineWidth = 3;
      canvasCtx.strokeStyle = '#10b981'; // สีเขียว Emerald แสดงสถานะตรวจจับได้
      canvasCtx.stroke();
    }
  }

  // ตั้งค่า MediaPipe Pose
  const pose = new Pose({
    locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/pose/${file}`
  });

  pose.setOptions({
    modelComplexity: 1,
    smoothLandmarks: true,
    minDetectionConfidence: 0.5,
    minTrackingConfidence: 0.5
  });

  pose.onResults(onResults);

  // เปิดใช้งานกล้องผ่าน Web Camera Utils
  const camera = new Camera(videoElement, {
    onFrame: async () => {
      await pose.send({ image: videoElement });
    },
    width: 640,
    height: 480
  });

  camera.start();
</script>
