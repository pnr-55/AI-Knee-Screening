<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI คัดกรองโรคข้อเข่า</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #eef6ff;
            text-align: center;
            padding: 40px;
        }

        h1 {
            color: #1e5aa8;
        }

        .box {
            background: white;
            padding: 30px;
            border-radius: 15px;
            width: 350px;
            margin: auto;
            box-shadow: 0 4px 10px #ccc;
        }

        button {
            background: #1e5aa8;
            color: white;
            border: none;
            padding: 12px 25px;
            border-radius: 10px;
            cursor: pointer;
        }
    </style>

</head>

<body>

    <h1>AI คัดกรองโรคข้อเข่า</h1>

    <div class="box">
        <h2>อัปโหลดภาพ X-ray</h2>

        <input type="file" id="imageInput">

        <br><br>

        <button>
            วิเคราะห์ภาพ
        </button>
    </div>

</body>
</html>
