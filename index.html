    <!-- 2. Consent & Patient Information Screen -->
    <section id="consent-screen" class="screen">
        <h2>หนังสือยินยอมและข้อมูลพื้นฐาน</h2>
        <p style="margin-top: 8px; font-size: 0.9rem;">กรุณาอ่านเงื่อนไขและกรอกข้อมูลพื้นฐานก่อนเริ่มการประเมิน</p>
        
        <div style="margin: 12px 0; padding: 10px; border: 1px solid #ddd; border-radius: 6px; max-height: 90px; overflow-y: auto; font-size: 0.85rem; background-color: #fafafa;">
            ข้าพเจ้ายินยอมให้ระบบประมวลผลข้อมูลส่วนบุคคล ได้แก่ อายุ น้ำหนัก ส่วนสูง และภาพถ่ายโครงสร้างร่างกายชั่วคราว เพื่อวัตถุประสงค์ในการประเมินความเสี่ยงข้อเข่าเบื้องต้นเท่านั้น
        </div>

        <div style="margin-bottom: 12px;">
            <label><input type="checkbox" id="chk-consent"> ข้าพเจ้าได้อ่านและยอมรับเงื่อนไขข้างต้น</label>
        </div>

        <!-- ฟอร์มกรอกข้อมูลพื้นฐานผู้ป่วย -->
        <div class="form-container" style="background: #f8fafc; padding: 14px; border-radius: 6px; margin-bottom: 12px;">
            <h3 style="font-size: 1rem; margin-bottom: 8px; color: #2c3e50;">ข้อมูลพื้นฐานผู้รับบริการ</h3>
            
            <div class="form-group" style="margin-bottom: 8px;">
                <label style="display: block; font-size: 0.85rem; margin-bottom: 4px;">อายุ (ปี):</label>
                <input type="number" id="input-age" placeholder="เช่น 25" style="width: 100%; padding: 8px; border: 1px solid #ccc; border-radius: 4px;">
            </div>

            <div class="form-group" style="margin-bottom: 8px;">
                <label style="display: block; font-size: 0.85rem; margin-bottom: 4px;">เพศ:</label>
                <select id="select-gender" style="width: 100%; padding: 8px; border: 1px solid #ccc; border-radius: 4px; background: #fff;">
                    <option value="">-- กรุณาเลือกเพศ --</option>
                    <option value="male">ชาย</option>
                    <option value="female">หญิง</option>
                    <option value="other">อื่นๆ</option>
                </select>
            </div>

            <div class="form-group" style="margin-bottom: 8px;">
                <label style="display: block; font-size: 0.85rem; margin-bottom: 4px;">น้ำหนัก (กิโลกรัม - kg):</label>
                <input type="number" step="0.1" id="input-weight" placeholder="เช่น 60" style="width: 100%; padding: 8px; border: 1px solid #ccc; border-radius: 4px;">
            </div>

            <div class="form-group" style="margin-bottom: 4px;">
                <label style="display: block; font-size: 0.85rem; margin-bottom: 4px;">ส่วนสูง (เซนติเมตร - cm):</label>
                <input type="number" step="0.1" id="input-height" placeholder="เช่น 170" style="width: 100%; padding: 8px; border: 1px solid #ccc; border-radius: 4px;">
            </div>
        </div>

        <div class="btn-group">
            <button id="btn-consent-back" class="btn btn-secondary">ย้อนกลับ</button>
            <button id="btn-consent-next" class="btn btn-primary">ถัดไป</button>
        </div>
    </section>
